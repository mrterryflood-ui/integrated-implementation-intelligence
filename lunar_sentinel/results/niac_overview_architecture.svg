<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820"><style>text{font-family:Arial}.t{font-size:34px;font-weight:bold}.h{font-size:22px;font-weight:bold}.b{font-size:16px}.box{fill:white;stroke:black;stroke-width:2}.soft{fill:#eef6ff;stroke:#245;stroke-width:2}.safe{fill:#fff3e6;stroke:#963;stroke-width:2}.bad{fill:#fcebea;stroke:#933;stroke-width:2}.ok{fill:#e9f7ef;stroke:#274;stroke-width:2}</style><text x="45" y="55" class="t">LUNAR SENTINEL: Mission Homeostasis</text><text x="45" y="90" class="b">Bounded NIAC Step A research demonstrator — not flight software or safety proof</text><rect x="50" y="130" width="260" height="115" class="box"/><text x="75" y="165" class="h">Lunar Basecamp</text><text x="75" y="198" class="b">Habitat • power • ISRU • rover • relay</text><rect x="370" y="130" width="270" height="115" class="soft"/><text x="395" y="165" class="h">Swappable Evidence</text><text x="395" y="198" class="b">Data age • uncertainty • validity</text><rect x="700" y="130" width="285" height="115" class="safe"/><text x="725" y="165" class="h">Path A: Local Protection</text><text x="725" y="198" class="b">Preauthorized safing, no Earth dependency</text><rect x="1045" y="130" width="285" height="115" class="ok"/><text x="1070" y="165" class="h">Bounded Action</text><text x="1070" y="198" class="b">T0 auto / T1-T2 human authority</text><rect x="370" y="325" width="270" height="115" class="soft"/><text x="395" y="360" class="h">Cascade Forecast</text><text x="395" y="393" class="b">Advisory only; no actuator command</text><rect x="700" y="325" width="285" height="115" class="safe"/><text x="725" y="360" class="h">Mission Contract Gate</text><text x="725" y="393" class="b">Assumptions • authority • deadlines</text><rect x="1045" y="325" width="285" height="115" class="bad"/><text x="1070" y="360" class="h">Unassured State</text><text x="1070" y="393" class="b">Declare limits; do not fabricate safety</text><rect x="370" y="530" width="615" height="125" class="box"/><text x="395" y="565" class="h">Provenance-Bound Decision Ledger</text><text x="395" y="598" class="b">Records what was known, data age, assumptions, authority, action, and outcome.</text><text x="50" y="735" class="b">Novelty focus: whether the safety claim remains valid as evidence, communications, authority, and configurations change.</text></svg>
