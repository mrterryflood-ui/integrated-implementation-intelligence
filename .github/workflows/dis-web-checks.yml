name: DIS web assurance
on:
  push:
    branches: [main, "dis/**"]
    paths: ['apps/dis-web/**', '.github/workflows/dis-web-checks.yml']
  pull_request:
    paths: ['apps/dis-web/**', '.github/workflows/dis-web-checks.yml']
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dis-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Unit and negative tests
        run: node --test tests/*.test.mjs
