name: Research fragmentation comparability
on:
  pull_request:
    paths:
      - "research/fragmentation-harm/**"
      - ".github/workflows/research-fragmentation-contract.yml"
  push:
    branches: [main]
    paths:
      - "research/fragmentation-harm/**"
      - ".github/workflows/research-fragmentation-contract.yml"
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate research comparability contract
        run: python research/fragmentation-harm/validate_contract.py
      - name: Regression tests
        run: python -m unittest discover -s research/fragmentation-harm -p "test_*.py" -v
      - name: Independent denominator invariants (archive replay is a separate source-dependent gate)
        run: python -m unittest discover -s research/fragmentation-harm/denominator_adjudication -p "test_*.py" -v
