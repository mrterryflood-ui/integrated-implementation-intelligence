name: ISS experience component regressions
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iss-experience-components-${{ github.ref }}
  cancel-in-progress: true
jobs:
  component-behavior:
    name: Synthetic component behavior (not production acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated locked test dependencies
        run: npm ci --prefix tools/iss-ebeas-ui --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Playwright browser
        working-directory: tools/iss-ebeas-ui
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise actual components and failure paths
        run: npm test --prefix tools/iss-ebeas-ui
      - name: Retain revision-bound synthetic receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iss-experience-components-${{ github.sha }}-${{ github.run_attempt }}
          path: tools/iss-ebeas-ui/tests/*-receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: State verification limits
        if: ${{ always() }}
        run: echo "Synthetic component tests are not full-application, live-user, store, compliance, or production acceptance." >> "$GITHUB_STEP_SUMMARY"
