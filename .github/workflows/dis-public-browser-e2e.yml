name: DIS public mobile browser acceptance
on:
  push:
    branches: [main]
    paths:
      - "apps/dis-platform/**"
      - ".github/workflows/dis-public-browser-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: apps/dis-platform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install DIS dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned Playwright for real browser tests
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install browser engines and system dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Test real deployed HTTP user journey in Chromium and mobile Safari WebKit
        run: node tests/e2e/public-site.mjs
        env:
          DIS_E2E_BASE_URL: https://dynamicintel.io
          DIS_E2E_ARTIFACT_DIR: test-results/dis-public-browser
      - name: Retain screenshots from the browser test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dis-public-mobile-browser-${{ github.run_number }}
          path: apps/dis-platform/test-results/dis-public-browser/
          if-no-files-found: ignore
          retention-days: 7
