name: Engineering receipt validator tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engineering-receipt-validator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile the receipt validator
        run: python3 -m py_compile scripts/engineering_receipt_gate.py
      - name: Exercise fail-closed policy fixtures, not application acceptance
        run: python3 -m unittest discover -s tests -p test_engineering_receipt_gate.py -v
