name: DIS authenticated platform typecheck
on:
  push:
    branches: [main, "dis/**"]
    paths: ['apps/dis-platform/**', '.github/workflows/dis-platform-checks.yml']
  pull_request:
    paths: ['apps/dis-platform/**', '.github/workflows/dis-platform-checks.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: read
concurrency:
  group: dis-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/dis-platform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
        env:
          DIS_EVAL_ARTIFACT_DIR: test-results/decision-contracts
      - name: Record bounded evaluation receipts
        if: always()
        run: |
          node -e 'const fs=require("node:fs"); const p="test-results/decision-contracts/universal-summary.json"; if(fs.existsSync(p)) { const s=JSON.parse(fs.readFileSync(p,"utf8")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## Cross-domain decision contracts\n\n"+JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,...s},null,2)+"\n"); }'
      - name: Preserve synthetic evaluation ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dis-decision-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/dis-platform/test-results/decision-contracts/
          if-no-files-found: ignore
          retention-days: 14

  candidate-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: apps/dis-platform
    env:
      VERCEL_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Build exact candidate with private identity intentionally unavailable
        run: npm run build
      - name: Run real candidate Chromium and iPhone WebKit journeys
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/dis-candidate.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/e2e/public-site.mjs
          node tests/e2e/ecosystem-planning.mjs
        env:
          DIS_E2E_BASE_URL: http://127.0.0.1:3000
          DIS_E2E_ARTIFACT_DIR: test-results/dis-candidate-browser
      - name: Retain candidate-browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dis-candidate-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/dis-platform/test-results/dis-candidate-browser/
          if-no-files-found: ignore
          retention-days: 14
